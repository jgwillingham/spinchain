[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "spinchain"
version = "0.1"
description = "Quantum spin chains using exact diagonalization and DMRG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest"]

[tool.scikit-build]
wheel.packages = ["python/spinchain"]

[tool.scikit-build.cmake.define]
SPINCHAIN_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
